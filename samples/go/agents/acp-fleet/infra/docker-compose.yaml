# The fleet: NATS, MySQL, three servers behind nginx on :8080, and server-4,
# which joins with `make join`.
name: acp-fleet

x-server: &server
  build:
    context: ../../..
    dockerfile: agents/acp-fleet/Dockerfile
    target: ${FLEET_AGENT:-fake}
  environment: &env
    PUBLIC_URL: http://localhost:8080
    NATS_URL: nats://nats:4222
    MYSQL_DSN: root:root@tcp(mysql:3306)/fleet?parseTime=true
    IDLE_TIMEOUT: 30s
    DRAIN_TIMEOUT: 60s
    MAX_AGENTS: "8"
    AGENT_COMMAND: ${AGENT_COMMAND:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  # Shards live on local disk, which a crash loses.
  tmpfs:
    - /var/lib/acp-fleet:mode=1777
  stop_grace_period: 90s
  depends_on:
    nats:
      condition: service_started
    mysql:
      condition: service_healthy

services:
  nats:
    image: nats:latest
    command: ["--jetstream"]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fleet
    volumes:
      - ../../../integrations/mysql/store/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 2s
      retries: 30

  server-1:
    <<: *server
    environment:
      <<: *env
      SERVER_NAME: server-1

  server-2:
    <<: *server
    environment:
      <<: *env
      SERVER_NAME: server-2

  server-3:
    <<: *server
    environment:
      <<: *env
      SERVER_NAME: server-3

  server-4:
    <<: *server
    profiles: [join]
    environment:
      <<: *env
      SERVER_NAME: server-4

  lb:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - server-1
      - server-2
      - server-3
