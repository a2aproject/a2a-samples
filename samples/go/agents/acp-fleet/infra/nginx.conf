# Round robin over the servers. Any server can take any request: the servers
# forward each one to the owner of its conversation's shard.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream fleet {
    zone fleet 64k;
    server server-1:8080 resolve max_fails=1 fail_timeout=5s;
    server server-2:8080 resolve max_fails=1 fail_timeout=5s;
    server server-3:8080 resolve max_fails=1 fail_timeout=5s;
    server server-4:8080 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 8080;

    location / {
        proxy_pass http://fleet;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Agents can stay silent for minutes while the model works.
        proxy_read_timeout 10m;
        # A crashed server stops answering; try the next one quickly.
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502;
    }
}
