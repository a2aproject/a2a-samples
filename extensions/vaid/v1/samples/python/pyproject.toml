[project]
name = "vaid-a2a-extension-sample"
version = "0.1.0"
description = "Minimal sample for the VAID A2A extension: mint a VAID, attach it to an A2A message, verify it with vaid-a2a."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "vaid-a2a>=0.2.1,<0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
